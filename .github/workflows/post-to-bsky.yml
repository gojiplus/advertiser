name: Post GitHub Repo to Bluesky

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without publishing
        type: boolean
        default: true
      pool:
        description: Repository pool
        type: choice
        options: [auto, featured, rotation]
        default: auto
  schedule:
    - cron: "0 7 * * *"
      timezone: America/Los_Angeles

concurrency:
  group: advertiser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  post:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Select and post repository
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_STAR_CUTOFF: "1"
          DRY_RUN: ${{ inputs.dry_run }}
          POOL: ${{ inputs.pool || 'auto' }}
        run: |
          args=(--pool "$POOL")
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          uv run --frozen --no-dev python scripts/post_repo_to_bsky.py "${args[@]}"
      - name: Save post history
        run: |
          if [[ -n "$(git status --short -- data/post_history.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/post_history.json
            git commit -m 'Record Bluesky post'
            git push
          fi
