name: Post Paper to Bluesky

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without publishing
        type: boolean
        default: true
      paper_id:
        description: Catalog paper ID (blank selects next prepared paper)
        type: string
        default: ""
      repost:
        description: Intentionally publish a corrected version of the selected paper
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * *"
      timezone: America/Los_Angeles

concurrency:
  group: advertiser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  post:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Select and post paper
        id: publish
        uses: ./
        with:
          config-file: data/paper-config.json
          history-file: data/paper_post_history.json
          bsky-handle: ${{ secrets.BSKY_HANDLE }}
          bsky-password: ${{ secrets.BSKY_PASSWORD }}
          dry-run: ${{ inputs.dry_run || false }}
          paper-id: ${{ inputs.paper_id }}
          repost: ${{ inputs.repost || false }}
          preview-dir: ${{ inputs.dry_run && 'preview' || '' }}
      - name: Upload preview
        if: inputs.dry_run
        uses: actions/upload-artifact@v7.0.2
        with:
          name: paper-preview
          path: preview/
          if-no-files-found: error
      - name: Save post history
        if: steps.publish.outputs.posted == 'true'
        run: |
          if [[ -n "$(git status --short -- data/paper_post_history.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/paper_post_history.json
            git commit -m 'Record paper post to Bluesky'
            git push
          fi
