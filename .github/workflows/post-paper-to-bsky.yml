name: Post Paper to Bluesky

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without publishing
        type: boolean
        default: true
      paper_id:
        description: Catalog paper ID (blank selects next prepared paper)
        type: string
        default: ""
  schedule:
    - cron: "0 7 * * *"
      timezone: America/Los_Angeles

concurrency:
  group: advertiser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  post:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Select and post paper
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          PAPER_ID: ${{ inputs.paper_id }}
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run --preview-dir preview); fi
          if [[ -n "$PAPER_ID" ]]; then args+=(--paper-id "$PAPER_ID"); fi
          uv run --frozen --no-dev python scripts/post_paper_to_bsky.py "${args[@]}"
      - name: Upload preview
        if: inputs.dry_run
        uses: actions/upload-artifact@v7.0.2
        with:
          name: paper-preview
          path: preview/
          if-no-files-found: error
      - name: Save post history
        run: |
          if [[ -n "$(git status --short -- data/paper_post_history.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/paper_post_history.json
            git commit -m 'Record paper post to Bluesky'
            git push
          fi
